<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arbitrage Pro</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .header {
            background: #111827;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #1f2937;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title h2 { margin: 0; font-size: 16px; color: #38bdf8; }
        .title p { margin: 2px 0 0 0; font-size: 10px; color: #9ca3af; }
        .badge {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .badge.active {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .connect-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0b0f19;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .control-group {
            display: flex;
            gap: 10px;
        }
        .start-btn {
            background: #22c55e;
            color: #000;
            font-weight: bold;
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .stop-btn {
            background: #ef4444;
            color: #fff;
            font-weight: bold;
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .card-title { font-size: 12px; color: #9ca3af; margin-bottom: 5px; }
        .card-value { font-size: 24px; font-weight: bold; color: #fff; }
        .sub-text { font-size: 11px; color: #38bdf8; margin-top: 5px; }
        .input-box {
            width: 100%;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .btn {
            background: linear-gradient(135deg, #22c55e, #10b981);
            color: #0b0f19;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }
        #withdraw-msg { font-size: 11px; margin-top: 8px; text-align: center; color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="title">
                    <h2>⚡ SOLANA ARBITRAGE PRO</h2>
                    <p>Atomic flash loan executor</p>
                </div>
                <div class="badge" id="status-badge">🔴 Stopped</div>
            </div>
            
            <div class="control-group">
                <button class="start-btn" onclick="controlBot('start')">▶ START</button>
                <button class="stop-btn" onclick="controlBot('stop')">⏹ STOP</button>
            </div>

            <!-- रियल-टाइम वॉलेट कनेक्ट/डिस्कनेक्ट बटन -->
            <button class="connect-btn" id="wallet-btn" onclick="toggleWalletConnection()">🔗 Connect Real Wallet</button>
        </div>

        <div class="card">
            <div class="card-title">📊 CURRENT SOLANA SLOT</div>
            <div class="card-value" id="slot-val">Loading...</div>
            <div class="sub-text" id="spread-val">Live Spread: Calculating...</div>
        </div>

        <div class="card">
            <div class="card-title">💰 NET ESTIMATED PROFIT</div>
            <div class="card-value" id="profit-val">$0.00</div>
            <input type="text" id="withdraw-addr" class="input-box" placeholder="Enter withdrawal Solana address...">
            <button class="btn" onclick="requestWithdrawal()">Withdraw Profits</button>
            <div id="withdraw-msg"></div>
        </div>

        <div class="card">
            <div class="card-title">⛽ SOL GAS BALANCE</div>
            <div class="card-value"><span id="gas-val">0.00</span> <span style="font-size: 14px; color: #9ca3af;">SOL</span></div>
            <div class="sub-text" id="wallet-status-text">Wallet not linked</div>
        </div>
    </div>

    <script>
        let connectedPublicKey = null;

        async function toggleWalletConnection() {
            const btn = document.getElementById('wallet-btn');
            
            if (connectedPublicKey) {
                // डिस्कनेक्ट करने की प्रोसेस
                try {
                    const provider = window.solana || window.solflare;
                    if (provider && provider.disconnect) {
                        await provider.disconnect();
                    }
                    connectedPublicKey = null;
                    btn.innerText = "🔗 Connect Real Wallet";
                    document.getElementById('wallet-status-text').innerText = "Wallet Disconnected ❌";
                } catch (e) {
                    console.error("Disconnect error", e);
                }
                return;
            }

            // कनेक्ट करने की प्रोसेस (Phantom / Solflare / Trust Wallet DApp Browser)
            try {
                const provider = window.solana || window.solflare;
                
                if (!provider) {
                    alert("No Solana wallet found! Please open this in Phantom, Solflare, or Trust Wallet DApp browser.");
                    return;
                }

                const response = await provider.connect();
                connectedPublicKey = response.publicKey.toString();
                
                const shortAddr = connectedPublicKey.substring(0, 4) + '...' + connectedPublicKey.slice(-4);
                btn.innerText = "🔌 Disconnect (" + shortAddr + ")";
                document.getElementById('wallet-status-text').innerText = "Connected: " + shortAddr;
                
                // ऑटोमैटिक विड्रॉल बॉक्स में भी एड्रेस भर जाएगा
                document.getElementById('withdraw-addr').value = connectedPublicKey;

            } catch (err) {
                console.error("Connection failed", err);
                alert("Wallet connection rejected or failed.");
            }
        }

        async function updateDashboard() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('slot-val').innerText = data.lastSlot;
                document.getElementById('spread-val').innerText = `Live Spread: ${data.lastSpread}`;
                document.getElementById('profit-val').innerText = data.netProfit;
                
                // अगर फ्रंटएंड पर वॉलेट कनेक्ट नहीं है, तब सर्वर वाला बैलेंस दिखाएगा
                if (!connectedPublicKey) {
                    document.getElementById('gas-val').innerText = data.gasBalance;
                }
                
                const badge = document.getElementById('status-badge');
                badge.innerText = data.status;
                if(data.status.includes("Live")) {
                    badge.classList.add('active');
                } else {
                    badge.classList.remove('active');
                }
            } catch (e) {
                console.error("Failed to fetch live data", e);
            }
        }

        async function controlBot(action) {
            try {
                await fetch('/api/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                updateDashboard();
            } catch (err) {
                console.error("Failed to control bot", err);
            }
        }

        async function requestWithdrawal() {
            const addr = document.getElementById('withdraw-addr').value;
            const msgBox = document.getElementById('withdraw-msg');
            
            if(!addr) {
                msgBox.style.color = "#f87171";
                msgBox.innerText = "Please enter a valid wallet address!";
                return;
            }

            try {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destinationAddress: addr })
                });
                const result = await res.json();
                
                msgBox.style.color = "#4ade80";
                msgBox.innerText = result.message;
            } catch (err) {
                msgBox.style.color = "#f87171";
                msgBox.innerText = "Withdrawal request failed!";
            }
        }

        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
