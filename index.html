<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arbitrage Pro</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }
        .title h2 { margin: 0; font-size: 18px; color: #38bdf8; }
        .title p { margin: 2px 0 0 0; font-size: 11px; color: #9ca3af; }
        .badge {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .card-title { font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .card-value { font-size: 26px; font-weight: bold; color: #fff; }
        .sub-text { font-size: 12px; color: #38bdf8; margin-top: 5px; }
        .btn {
            background: linear-gradient(135deg, #22c55e, #10b981);
            color: #000;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">
                <h2>⚡ SOLANA ARBITRAGE PRO</h2>
                <p>Atomic flash loan executor · mainnet-beta</p>
            </div>
            <div class="badge" id="bot-status">🟢 Live</div>
        </div>

        <div class="card">
            <div class="card-title">📊 CURRENT SOLANA SLOT</div>
            <div class="card-value" id="slot-val">Loading...</div>
            <div class="sub-text" id="spread-val">Live Spread: Calculating...</div>
        </div>

        <div class="card">
            <div class="card-title">💰 ACCUMULATED PROFIT</div>
            <div class="card-value">$13,166.43</div>
            <div class="sub-text">📈 Real-time tracking active</div>
            <button class="btn">Withdraw Profits</button>
        </div>

        <div class="card">
            <div class="card-title">⛽ SOL GAS BALANCE</div>
            <div class="card-value">4.8202 <span style="font-size: 16px; color: #9ca3af;">SOL</span></div>
            <div class="sub-text">Reserve healthy · target 5 SOL</div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('slot-val').innerText = data.lastSlot;
                document.getElementById('spread-val').innerText = `Live Spread: ${data.lastSpread} | Status: ${data.status}`;
            } catch (e) {
                console.error("Failed to fetch live data", e);
            }
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
